<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300;400;600;700&display=swap">
  <style>
    body { margin: 0; background: #f3eee2; color: #44403c;
           font-family: 'Overpass Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
           -webkit-font-smoothing: antialiased; }
    a { color: #0fada8; } a:hover { color: #0c8b87; }
    .lbl { position: absolute; left: 0; top: 0; line-height: 1; white-space: nowrap;
           pointer-events: none; }
    .lbl-start { transform: translate(0, -0.75em); }
    .lbl-middle { transform: translate(-50%, -0.75em); }
    .lbl-end { transform: translate(-100%, -0.75em); }
    .hit { cursor: pointer; user-select: none; }
    .grip { touch-action: none; display: flex; align-items: center; justify-content: center; }
    .grip > span { border-radius: 2px; background: #ddd9d2; transition: background .12s; }
    .grip:hover > span { background: #0fada8; }
    .grip-row { flex: 1; min-height: 9px; cursor: row-resize; }
    .grip-row > span { width: 34px; height: 3px; }
    .grip-col { flex: 1; min-width: 9px; cursor: col-resize; }
    .grip-col > span { width: 3px; height: 34px; }
  </style>
</helmet>
<div style="width:1000px;height:880px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;background:#f3eee2">

  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
    <div style="display:flex;align-items:baseline;gap:10px">
      <span style="font-size:11px;font-weight:700;letter-spacing:.16em;color:#0fada8">W</span>
      <span style="font-size:15px;font-weight:700;color:#033056">Space split &mdash; how much room the map takes from the chart</span>
    </div>
    <span style="font-size:11px;color:#a8a29e;text-align:right">Pick a starting point, then drag any handle between two panes.</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
      <div class="hit" onClick="{{ o.pick }}" style="background:{{o.cardBg}};border:1.5px solid {{o.cardEdge}};border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:6px">
          <span style="font-size:10.5px;font-weight:700;color:{{o.titleInk}}">{{o.title}}</span>
          <span style="font-size:9px;color:#a8a29e">{{o.ratio}}</span>
        </div>
        <svg viewBox="0 0 200 118" width="100%" height="76">
          <rect x="0" y="0" width="200" height="118" rx="3" fill="#f3eee2"></rect>
          <sc-for list="{{o.thumb}}" as="b" hint-placeholder-count="5">
            <g>
              <rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="2" fill="{{b.fill}}"></rect>
              <foreignObject x="{{b.tx}}" y="{{b.ty}}" width="1" height="1" style="overflow:visible"><div class="lbl lbl-middle" style="font-size:7px;color:{{b.ink}}">{{b.label}}</div></foreignObject>
            </g>
          </sc-for>
        </svg>
      </div>
    </sc-for>
  </div>

  <div style="flex:1;background:#f8f6f1;border-radius:8px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-height:0">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <span style="font-size:12px;font-weight:600;color:#78716c;text-transform:uppercase;letter-spacing:.08em">{{ frameTitle }}</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:11px;color:#a8a29e">{{ dragState }}</span>
        <span class="hit" onClick="{{ reset }}" style="font-size:11px;color:#0fada8;font-weight:600">Reset</span>
      </div>
    </div>

    <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:7px">

      <div style="height:22px;border-radius:3px;background:#ece9e2;display:flex;align-items:center;padding:0 10px;flex-shrink:0">
        <span style="font-size:9.5px;color:#78716c;letter-spacing:.1em">METRO RIDERSHIP</span>
      </div>
      <div style="height:26px;border-radius:3px;background:#fff;display:flex;align-items:center;padding:0 10px;flex-shrink:0">
        <span style="font-size:9.5px;color:#a8a29e">Date range &middot; Jul 2025 &rarr; Jun 2026</span>
      </div>

      <div style="flex:1;min-height:0;display:flex;gap:7px">

        <div style="width:23%;flex-shrink:0;border-radius:3px;background:#fff;padding:9px;display:flex;flex-direction:column;gap:5px">
          <span style="font-size:9px;color:#78716c;text-transform:uppercase;letter-spacing:.06em">Lines</span>
          <sc-for list="{{railRows}}" as="r" hint-placeholder-count="8">
            <div style="display:flex;align-items:center;gap:5px">
              <span style="width:8px;height:8px;border-radius:2px;background:{{r.color}}"></span>
              <span style="height:5px;border-radius:2px;background:#ece9e2;width:{{r.w}}"></span>
            </div>
          </sc-for>
        </div>

        <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
            <div style="flex:{{row.flex}};min-height:0;display:flex;flex-direction:column">
              <sc-if value="{{row.isGrip}}" hint-placeholder-val="{{ false }}">
                <div class="grip grip-row" onPointerDown="{{ row.onDown }}" title="Drag to change how tall these are"><span></span></div>
              </sc-if>
              <sc-if value="{{row.isBand}}" hint-placeholder-val="{{ true }}">
                <div style="display:flex;flex:1;min-height:0">
                  <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="3">
                    <div style="flex:{{cell.flex}};min-width:0;display:flex">
                      <sc-if value="{{cell.isGrip}}" hint-placeholder-val="{{ false }}">
                        <div class="grip grip-col" onPointerDown="{{ cell.onDown }}" title="Drag to change how wide these are"><span></span></div>
                      </sc-if>
                      <sc-if value="{{cell.isColumn}}" hint-placeholder-val="{{ true }}">
                        <div style="flex:1;min-width:0;display:flex;flex-direction:column">
                          <sc-for list="{{cell.panes}}" as="pane" hint-placeholder-count="1">
                           <div style="flex:{{pane.flex}};min-height:0;display:flex;flex-direction:column">
                            <sc-if value="{{pane.isGrip}}" hint-placeholder-val="{{ false }}">
                              <div class="grip grip-row" onPointerDown="{{ pane.onDown }}" title="Drag to change how tall these are"><span></span></div>
                            </sc-if>
                            <sc-if value="{{pane.isPane}}" hint-placeholder-val="{{ true }}">
                            <div style="flex:1;min-height:0;border-radius:3px;background:#ffffff;border:{{pane.border}};box-sizing:border-box;padding:8px 10px;display:flex;flex-direction:column;gap:5px;overflow:hidden">
                              <div style="display:flex;align-items:baseline;justify-content:space-between;gap:6px">
                                <span style="font-size:9.5px;font-weight:700;color:{{pane.ink}};text-transform:uppercase;letter-spacing:.06em">{{pane.label}}</span>
                                <span style="font-size:8.5px;color:{{pane.sizeInk}};font-variant-numeric:tabular-nums">{{pane.size}}</span>
                              </div>
                              <div style="flex:1;min-height:0;border-radius:2px;background:{{pane.wellBg}};position:relative;overflow:hidden">
                                <svg viewBox="0 0 200 100" width="100%" height="100%" preserveAspectRatio="none">
                                  <sc-if value="{{pane.isChart}}" hint-placeholder-val="{{ false }}">
                                    <g>
                                      <polyline points="6,78 34,70 62,64 90,52 118,44 146,32 174,22 194,16" fill="none" stroke="#0072bc" stroke-width="2.5" vector-effect="non-scaling-stroke"></polyline>
                                      <polyline points="6,88 34,84 62,80 90,74 118,70 146,64 174,58 194,54" fill="none" stroke="#eb131b" stroke-width="2.5" vector-effect="non-scaling-stroke"></polyline>
                                      <line x1="0" y1="95" x2="200" y2="95" stroke="#e0dcd4" stroke-width="1" vector-effect="non-scaling-stroke"></line>
                                    </g>
                                  </sc-if>
                                  <sc-if value="{{pane.isMap}}" hint-placeholder-val="{{ false }}">
                                    <g>
                                      <rect x="0" y="0" width="200" height="100" fill="#e8e6e1"></rect>
                                      <polyline points="150,14 150,38 120,52 100,66 100,92" fill="none" stroke="#0072bc" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
                                      <polyline points="100,66 62,50 26,40" fill="none" stroke="#a05da5" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
                                      <circle cx="150" cy="14" r="7" fill="#0072bc" fill-opacity=".45" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"></circle>
                                      <circle cx="100" cy="66" r="5.5" fill="#0072bc" fill-opacity=".45" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"></circle>
                                      <circle cx="100" cy="92" r="4" fill="#0072bc" fill-opacity=".45" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"></circle>
                                      <circle cx="62" cy="50" r="4.5" fill="#a05da5" fill-opacity=".45" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"></circle>
                                      <circle cx="26" cy="40" r="3" fill="#a05da5" fill-opacity=".45" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"></circle>
                                    </g>
                                  </sc-if>
                                  <sc-if value="{{pane.isTable}}" hint-placeholder-val="{{ false }}">
                                    <g>
                                      <sc-for list="{{pane.tableRows}}" as="t" hint-placeholder-count="6">
                                        <g>
                                          <rect x="4" y="{{t.y}}" width="{{t.nameW}}" height="4" rx="2" fill="#ddd9d2"></rect>
                                          <rect x="{{t.barX}}" y="{{t.y}}" width="{{t.barW}}" height="4" rx="2" fill="#0072bc" fill-opacity=".5"></rect>
                                        </g>
                                      </sc-for>
                                    </g>
                                  </sc-if>
                                  <sc-if value="{{pane.isSummary}}" hint-placeholder-val="{{ false }}">
                                    <g>
                                      <rect x="6" y="20" width="52" height="7" rx="3" fill="#ddd9d2"></rect>
                                      <rect x="6" y="34" width="76" height="14" rx="3" fill="#c9c4ba"></rect>
                                      <rect x="6" y="58" width="52" height="7" rx="3" fill="#ddd9d2"></rect>
                                      <rect x="6" y="72" width="76" height="14" rx="3" fill="#c9c4ba"></rect>
                                    </g>
                                  </sc-if>
                                </svg>
                              </div>
                            </div>
                            </sc-if>
                           </div>
                          </sc-for>
                        </div>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="background:#fff;border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex-shrink:0">
      <span style="font-size:11px;font-weight:700;color:{{ noteInk }};letter-spacing:.06em;text-transform:uppercase">{{ noteHead }}</span>
      <span style="font-size:11px;color:#44403c;line-height:1.65">{{ noteBody }}</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { split: 'built', bandGrow: null, cellGrow: null, paneGrow: null, dragging: false };
    this.move = null;
    this.up = null;
  }

  componentWillUnmount() {
    this.stop();
  }

  stop() {
    if (this.move) window.removeEventListener('pointermove', this.move);
    if (this.up) window.removeEventListener('pointerup', this.up);
    this.move = null;
    this.up = null;
  }

  // One drag adjusts the pair either side of the handle and leaves every other pane alone.
  startDrag(e, axis, current, index, container) {
    e.preventDefault();
    const self = this;
    const rect = container.getBoundingClientRect();
    const vertical = axis === 'y' || axis === 'p';
    const usable = (vertical ? rect.height : rect.width) - (current.length - 1) * 9;
    if (usable <= 0) return;
    const start = vertical ? e.clientY : e.clientX;
    const base = current.slice();
    const total = base.reduce((a, b) => a + b, 0);
    const pairTotal = base[index] + base[index + 1];
    const MIN = 0.25;

    this.stop();
    this.setState({ dragging: true });

    this.move = (ev) => {
      const delta = ((vertical ? ev.clientY : ev.clientX) - start) / usable * total;
      const next = base.slice();
      next[index] = Math.max(MIN, Math.min(pairTotal - MIN, base[index] + delta));
      next[index + 1] = pairTotal - next[index];
      const rounded = next.map((v) => Math.round(v * 1000) / 1000);
      if (axis === 'y') { self.setState({ bandGrow: rounded }); return; }
      if (axis === 'p') {
        const pgs = self.state.paneGrow || {};
        const c2 = {};
        Object.keys(pgs).forEach((k) => { c2[k] = pgs[k]; });
        c2[self.dragKey] = rounded;
        self.setState({ paneGrow: c2 });
        return;
      }
      {
        const cg = (self.state.cellGrow || {});
        const copy = {};
        Object.keys(cg).forEach((k) => { copy[k] = cg[k]; });
        copy[String(self.dragBand)] = rounded;
        self.setState({ cellGrow: copy });
      }
    };
    this.up = () => { self.stop(); self.setState({ dragging: false }); };

    window.addEventListener('pointermove', this.move);
    window.addEventListener('pointerup', this.up);
  }

  pane(kind, grow, label, size, emphasis, live) {
    return {
      isGrip: false, isPane: true,
      flex: String(grow),
      label: label,
      size: size,
      sizeInk: live ? '#0fada8' : '#a8a29e',
      ink: emphasis ? '#033056' : '#78716c',
      border: emphasis ? '1.5px solid #0fada8' : '1px solid #f0ede6',
      wellBg: kind === 'map' ? '#e8e6e1' : '#f8f6f1',
      isChart: kind === 'chart',
      isMap: kind === 'map',
      isTable: kind === 'table',
      isSummary: kind === 'summary',
      tableRows: [0, 1, 2, 3, 4, 5].map((i) => ({
        y: 8 + i * 14, nameW: 46 - i * 2, barX: 58, barW: 128 - i * 19,
      })),
    };
  }

  layouts() {
    const t = (x, y, w, h, label, fill, ink) => ({
      x: x, y: y, w: w, h: h, label: label, fill: fill, ink: ink || '#78716c',
      tx: x + w / 2, ty: y + h / 2 + 2.5,
    });
    const CHART = '#cfe0ee', MAP = '#ddd9d2', PANEL = '#efeae1', RAIL = '#e7e5e4';

    return {
      built: {
        title: 'As built', ratio: 'map 60% wide',
        frameTitle: 'As built — the chart owns the full width, the map shares a row with the summary',
        thumb: [t(4,4,40,110,'',RAIL), t(48,4,148,34,'chart',CHART,'#033056'), t(48,42,57,34,'summary',PANEL), t(109,42,87,34,'map',MAP), t(48,80,148,34,'stops',PANEL)],
        bandGrow: [2, 2, 2.4],
        bands: [
          [{ grow: 1, panes: [['chart', 'Ridership over time', true]] }],
          [{ grow: 2, panes: [['summary', 'Summary', false]] }, { grow: 3, panes: [['map', 'Map', true]] }],
          [{ grow: 1, panes: [['table', 'Stop ridership', false]] }],
        ],
        head: 'Today the map has no height rule of its own',
        ink: '#78716c',
        body: 'OutputArea sets a minimum height on the whole right column and nothing on the map pane, so the map is however tall its row happens to be once the chart and the summary have taken theirs. Its width is fixed though: three parts of five beside the summary’s two, and only when something is selected — with nothing selected the summary disappears and the map goes full width, which is the one moment the map is at its largest.',
      },
      beside: {
        title: 'Chart beside map', ratio: '50 / 50',
        frameTitle: 'Chart beside map — the two figures share one row and one height',
        thumb: [t(4,4,40,110,'',RAIL), t(48,4,73,52,'chart',CHART,'#033056'), t(125,4,71,52,'map',MAP), t(48,60,148,20,'summary',PANEL), t(48,84,148,30,'stops',PANEL)],
        bandGrow: [3, 0.9, 2.2],
        bands: [
          [{ grow: 1, panes: [['chart', 'Ridership over time', true]] }, { grow: 1, panes: [['map', 'Map', true]] }],
          [{ grow: 1, panes: [['summary', 'Summary', false]] }],
          [{ grow: 1, panes: [['table', 'Stop ridership', false]] }],
        ],
        head: 'Side by side is the only split where a reader holds both figures at once',
        ink: '#166534',
        body: 'The map and the chart are two views of one selection, and putting them in one row means a click on a circle and the line it lights up are in the same glance rather than separated by a scroll. The price is width: the chart drops from the full column to half of it, and a seventeen-year monthly series in that width crushes its x-axis to about four labels. Drag the handle between them and watch where that stops being survivable.',
      },
      mapFirst: {
        title: 'Map first', ratio: 'map 2/3 tall',
        frameTitle: 'Map first — the geography leads and the chart becomes a strip',
        thumb: [t(4,4,40,110,'',RAIL), t(48,4,100,74,'map',MAP,'#033056'), t(152,4,44,74,'stops',PANEL), t(48,82,148,32,'chart',CHART)],
        bandGrow: [3.4, 1.3],
        bands: [
          [{ grow: 5, panes: [['map', 'Map', true]] }, { grow: 3, panes: [['table', 'Stop ridership', false]] }],
          [{ grow: 1, panes: [['chart', 'Ridership over time', false]] }],
        ],
        head: 'Map first suits stop data and fights the app it lives in',
        ink: '#9a3412',
        body: 'Stop-level ridership is the most spatial thing this app holds, and a map that fills two-thirds of the height is where eight hundred circles stop overlapping. But the chart above it covers 2009 to 2026 for whole lines, which is what the app was built to answer, and cutting it to a strip demotes the primary question to serve the secondary one. This split is worth building only if stop mode is a mode — a view the reader turns on, with its own proportions — rather than a section of the existing page.',
      },
      panelFirst: {
        title: 'Panel first', ratio: 'figures 30% wide',
        frameTitle: 'Panel first — the table leads and both figures become a rail',
        thumb: [t(4,4,40,110,'',RAIL), t(48,4,104,110,'stops',PANEL,'#033056'), t(156,4,40,53,'chart',CHART), t(156,61,40,53,'map',MAP)],
        bandGrow: [1],
        bands: [
          [
            { grow: 7, panes: [['table', 'Stop ridership', true]] },
            { grow: 3, panes: [['chart', 'Over time', false], ['map', 'Map', false]] },
          ],
        ],
        head: 'Panel first is the honest layout for a ranked table and the worst one for a map',
        ink: '#78716c',
        body: 'If the table is the answer and the figures are context, this is the shape: the eight hundred rows get the width they need for a long stop name plus both measures, and the chart and map sit beside them as a rail a reader glances at. It also breaks the map, which needs area rather than height — a narrow tall pane of Los Angeles is mostly ocean and desert. Reach for this only if the ranking wins, and expect to replace the map in the rail with something that survives being narrow, such as the corridor profile.',
      },
    };
  }

  renderVals() {
    const self = this;
    const split = this.state.split;
    const all = this.layouts();
    const L = all[split];

    const bandGrow = this.state.bandGrow || L.bandGrow;
    const bandTotal = bandGrow.reduce((a, b) => a + b, 0);
    const cellGrow = this.state.cellGrow || {};
    const paneGrow = this.state.paneGrow || {};
    const touchedNow = this.state.bandGrow !== null || this.state.cellGrow !== null || this.state.paneGrow !== null;

    const pct = (v, total) => String(Math.round((v / total) * 100)) + '%';

    const rows = [];
    L.bands.forEach((cells, bi) => {
      if (bi > 0) {
        rows.push({
          isGrip: true, isBand: false, flex: '0 0 9px',
          onDown: (e) => self.startDrag(e, 'y', bandGrow, bi - 1, e.currentTarget.parentElement.parentElement),
        });
      }

      const grows = cellGrow[String(bi)] || cells.map((c) => c.grow);
      const cellTotal = grows.reduce((a, b) => a + b, 0);

      const built = [];
      cells.forEach((c, ci) => {
        if (ci > 0) {
          built.push({
            isGrip: true, isColumn: false, flex: '0 0 9px',
            onDown: (e) => {
              self.dragBand = bi;
              self.startDrag(e, 'x', grows, ci - 1, e.currentTarget.parentElement.parentElement);
            },
          });
        }
        built.push({
          isGrip: false, isColumn: true,
          flex: String(grows[ci]),
          panes: (() => {
            const key = String(bi) + ':' + String(ci);
            const pg = paneGrow[key] || c.panes.map(() => 1);
            const pTotal = pg.reduce((a, b) => a + b, 0);
            const out = [];
            c.panes.forEach((p, pi) => {
              if (pi > 0) {
                out.push({
                  isGrip: true, isPane: false, flex: '0 0 9px',
                  onDown: (e) => {
                    self.dragKey = key;
                    self.startDrag(e, 'p', pg, pi - 1, e.currentTarget.parentElement.parentElement);
                  },
                });
              }
              const label = c.panes.length > 1
                ? pct(pg[pi], pTotal) + ' of rail'
                : cells.length > 1
                  ? pct(grows[ci], cellTotal) + ' wide'
                  : pct(bandGrow[bi], bandTotal) + ' tall';
              out.push(self.pane(p[0], pg[pi], p[1], label, p[2], touchedNow));
            });
            return out;
          })(),
        });
      });

      rows.push({ isGrip: false, isBand: true, flex: String(bandGrow[bi]), cells: built });
    });

    const options = ['built', 'beside', 'mapFirst', 'panelFirst'].map((key) => ({
      title: all[key].title,
      ratio: all[key].ratio,
      thumb: all[key].thumb,
      pick: () => self.setState({ split: key, bandGrow: null, cellGrow: null, paneGrow: null }),
      cardBg: split === key ? '#f8f6f1' : '#fbfaf7',
      cardEdge: split === key ? '#0fada8' : '#ece9e2',
      titleInk: split === key ? '#033056' : '#78716c',
    }));

    const touched = touchedNow;

    return {
      options: options,
      rows: rows,
      frameTitle: L.frameTitle,
      dragState: this.state.dragging ? 'dragging' : touched ? 'adjusted from the preset' : 'at the preset',
      reset: () => self.setState({ bandGrow: null, cellGrow: null, paneGrow: null }),
      noteHead: L.head,
      noteInk: L.ink,
      noteBody: L.body,
      railRows: [
        { color: '#0072bc', w: '76%' }, { color: '#eb131b', w: '62%' },
        { color: '#0fada8', w: '70%' }, { color: '#a05da5', w: '58%' },
        { color: '#fdb913', w: '66%' }, { color: '#78716c', w: '54%' },
        { color: '#78716c', w: '68%' }, { color: '#78716c', w: '48%' },
      ],
