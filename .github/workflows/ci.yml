name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref. Superseded PR runs are cancelled; runs on main are never
# cancelled, so every commit on the default branch keeps a complete, attributable result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Only the tracked suites run here. The rendering suites and the Playwright suite are
      # gitignored and run on a developer machine — see the "Testing" section of README.md.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
